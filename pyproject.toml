[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "deadlinkfinder"
version = "0.2.1"
description = "Fast, zero-dependency Markdown link, image, and heading anchor verifier CLI."
readme = "README.md"
license = "MIT"
authors = [{ name = "Umut Güngör" }]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
deadlinkfinder = "deadlinkfinder.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deadlinkfinder"]

[tool.pytest.ini_options]
testpaths = ["contract_tests", "tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = "../../../.ruff_cache"
